<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f0e6" />
    <title>{{code}} · InternTrack</title>
    <link rel="icon" type="image/png" href="/static/brand/interntrack-logo.png" />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body class="error-document">
    <header class="error-masthead"><a class="brand" href="/"><img class="brand-logo" src="/static/brand/interntrack-logo.png" alt="" width="48" height="48" />InternTrack</a><span class="eyebrow">YOUR NEXT MOVE</span></header>
    <main class="error-page" aria-labelledby="error-title">
      <div class="error-code" aria-hidden="true">{{code}}</div>
      <div class="error-copy"><div class="eyebrow">{{label}}</div><h1 id="error-title">{{title}}</h1><p>{{message}}</p><div class="actions"><a class="primary recovery-link" href="/#dashboard">Go to dashboard ↗</a><a class="text-button" href="/#applications">View applications</a></div><p class="error-footnote">{{hint}}</p></div>
    </main>
    <footer>Made for your next move. <span>InternTrack</span></footer>
  </body>
</html>
