services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: interntrack
      POSTGRES_USER: interntrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interntrack -d interntrack"]
      interval: 3s
      timeout: 3s
      retries: 15
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://interntrack:${POSTGRES_PASSWORD}@db:5432/interntrack
      UPLOAD_DIR: /app/uploads
      COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: '["http://127.0.0.1:8000","http://localhost:8000"]'
    volumes:
      - resumes:/app/uploads
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  resumes:
